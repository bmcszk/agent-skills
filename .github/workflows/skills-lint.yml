name: skills-lint

on:
  push:
    branches: [master]
    paths: ['skills/**', '.github/workflows/skills-lint.yml']
  pull_request:
    paths: ['skills/**', '.github/workflows/skills-lint.yml']

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Structural gate (skillscheck)
        run: uvx skillscheck skills --strict

      - name: Style gate (skill-craft shim)
        run: |
          python3 skills/skill-craft/scripts/skill-lint.py skills
